name: Apply Pi visual source
on:
  push:
    branches: [feat/pi-visual-tools]
    paths: [.github/pi-visual-transfer.11.patch]
permissions:
  contents: read
jobs:
  apply-and-verify:
    if: github.repository == 'zmfkzj/herdr-web-ui' && github.ref == 'refs/heads/feat/pi-visual-tools'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checksum-verified source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pi-visual-transfer.{01,02,03,04,05,06,07,08,09,10,11}.patch > /tmp/pi-visual.patch
          echo '426b1eee7caa15e9e6e7e9f232a5ac7efbc4038e2aa45cc4276f932f3075c297  /tmp/pi-visual.patch' | sha256sum --check
          git apply --check --unidiff-zero /tmp/pi-visual.patch
          git apply --unidiff-zero /tmp/pi-visual.patch
      - uses: ./.github/actions/setup-ci
        with:
          node: 'true'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test server/pi-visual/visual.test.ts server/pi-visual/tunnel.test.ts src/lib/pi-visual/visual.test.ts src/lib/i18n.test.ts server/conventions.test.ts src/conventions.test.ts scripts/conventions.test.ts
      - name: Commit normal source changes and remove transfer files
        run: |
          git rm --ignore-unmatch .github/pi-visual-transfer.*
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(pi-visual): add original Pi workers, private desktops and image comments'
          git push origin HEAD:refs/heads/feat/pi-visual-tools
      - name: Browser feature verification
        run: CHROME_PATH="$(command -v google-chrome)" bun scripts/pi-visual-browser-qa.ts
      - run: bun run test:unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-visual-browser-evidence
          path: evidence/pi-visual
          retention-days: 7
          if-no-files-found: ignore
